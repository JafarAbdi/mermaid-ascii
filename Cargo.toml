[package]
name         = "mermaid-ascii"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "Apache-2.0"
description  = "Render Mermaid diagrams as terminal-safe Unicode art"
repository   = "https://github.com/JafarAbdi/mermaid-ascii"
readme       = "README.md"
keywords     = ["mermaid", "diagram", "ascii", "terminal", "cli"]
categories   = ["command-line-utilities", "visualization"]

[dependencies]
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"
strip         = "symbols"
