[package]
name        = "mermaid-ascii"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
description = "Render Mermaid diagrams as terminal-safe Unicode art"
readme      = "README.md"

[dependencies]
ratatui       = { version = "0.29", default-features = false }
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto           = true
panic         = "abort"
strip         = "symbols"
